openapi: 3.0.3
info:
  title: NightLife API
  version: 1.0.0
  description: API documentation for NightLife platform
paths:
  /api/discovery/heatmap/stats/:
    get:
      operationId: discovery_heatmap_stats_retrieve
      summary: Get Heatmap Statistics
      parameters:
      - in: query
        name: lat
        schema:
          type: number
          format: float
        description: Latitude
      - in: query
        name: lng
        schema:
          type: number
          format: float
        description: Longitude
      - in: query
        name: radius
        schema:
          type: number
          format: float
        description: Radius in km (default 20)
      - in: query
        name: time_filter
        schema:
          type: string
          enum:
          - live
          - tonight
          - week
        description: Time filter (default live)
      tags:
      - discovery
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/discovery/heatmap/zones/:
    get:
      operationId: discovery_heatmap_zones_retrieve
      summary: Get Heatmap Zones
      parameters:
      - in: query
        name: lat
        schema:
          type: number
          format: float
        description: Latitude
      - in: query
        name: lng
        schema:
          type: number
          format: float
        description: Longitude
      - in: query
        name: max_lat
        schema:
          type: number
          format: float
        description: Maximum latitude for bounding box
      - in: query
        name: max_lng
        schema:
          type: number
          format: float
        description: Maximum longitude for bounding box
      - in: query
        name: min_lat
        schema:
          type: number
          format: float
        description: Minimum latitude for bounding box
      - in: query
        name: min_lng
        schema:
          type: number
          format: float
        description: Minimum longitude for bounding box
      - in: query
        name: radius
        schema:
          type: number
          format: float
        description: Radius in km (default 20)
      - in: query
        name: time_filter
        schema:
          type: string
          enum:
          - live
          - tonight
          - week
        description: Time filter (default live)
      tags:
      - discovery
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/discovery/nearby/:
    get:
