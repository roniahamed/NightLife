components:
  schemas:
    AgeRestrictionEnum:
      enum:
      - none
      - 18+
      - 21+
      type: string
      description: |-
        * `none` - No Restriction
        * `18+` - 18+
        * `21+` - 21+
    Amenity:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 100
        description:
          type: string
        icon:
          type: string
          format: uri
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - name
      - updated_at
    AmenityRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
        icon:
          type: string
          format: binary
          nullable: true
      required:
      - name
    Attendee:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        user:
          type: string
          format: uuid
        user_name:
          type: string
          readOnly: true
        user_email:
          type: string
          format: email
          readOnly: true
        ticket_tier_name:
          type: string
          readOnly: true
        quantity:
          type: integer
          maximum: 2147483647
          minimum: 0
        status:
          $ref: '#/components/schemas/StatusEnum'
        is_scanned:
          type: boolean
        scanned_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - ticket_tier_name
      - user
      - user_email
      - user_name
    AvailableProfilesResponse:
      type: object
      properties:
        profiles:
          type: array
          items:
            $ref: '#/components/schemas/ProfileDetail'
      required:
      - profiles
    ChangePassword:
      type: object
      properties:
        old_password:
          type: string
        new_password:
          type: string
        confirm_password:
          type: string
      required:
      - confirm_password
      - new_password
      - old_password
    ChangePasswordRequest:
      type: object
      properties:
        old_password:
          type: string
          minLength: 1
        new_password:
          type: string
          minLength: 1
        confirm_password:
          type: string
          minLength: 1
      required:
      - confirm_password
      - new_password
      - old_password
    Comment:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        user:
          allOf:
          - $ref: '#/components/schemas/UserPublicProfile'
          readOnly: true
        text:
          type: string
        parent:
          type: string
          format: uuid
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        replies_count:
          type: integer
          readOnly: true
      required:
      - created_at
      - id
      - replies_count
      - text
      - updated_at
      - user
    CommentRequest:
      type: object
      properties:
        text:
          type: string
          minLength: 1
        parent:
          type: string
          format: uuid
          nullable: true
      required:
      - text
    CustomTokenObtainPairRequest:
      type: object
      properties:
        email:
          type: string
          writeOnly: true
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - email
      - password
    DashboardAnalytics:
      type: object
      properties:
        revenue_this_week:
          type: number
          format: double
        revenue_percentage_change:
          type: number
          format: double
        total_followers:
          type: integer
        new_followers_this_week:
          type: integer
        tickets_sold_this_week:
          type: integer
        tickets_sold_percentage_change:
          type: number
          format: double
        heat_score:
          type: integer
        revenue_chart_data:
          type: array
          items:
            $ref: '#/components/schemas/DashboardChartData'
        recent_activity:
          type: array
          items:
            $ref: '#/components/schemas/DashboardRecentActivity'
        total_tickets_sold:
          type: integer
        total_revenue:
          type: number
          format: double
        platform_fees_paid:
          type: number
          format: double
        net_earnings:
          type: number
          format: double
        stripe_available_balance:
          type: number
          format: double
        stripe_pending_balance:
          type: number
          format: double
        active_events_count:
          type: integer
        recent_transactions:
          type: array
          items:
            type: object
            additionalProperties: {}
      required:
      - active_events_count
      - heat_score
      - net_earnings
      - new_followers_this_week
      - platform_fees_paid
      - recent_activity
      - recent_transactions
      - revenue_chart_data
      - revenue_percentage_change
      - revenue_this_week
      - stripe_available_balance
      - stripe_pending_balance
      - tickets_sold_percentage_change
      - tickets_sold_this_week
